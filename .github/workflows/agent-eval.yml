name: agent-eval
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/agent/**'
      - 'packages/evaluator/**'
      - 'packages/telemetry/**'
      - 'packages/shared/**'
      - 'suites/**'
      - '.github/workflows/agent-eval.yml'

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_eval
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_eval"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent_eval
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL || 'gpt-5-mini' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'gpt-5-mini' }}
      ENABLE_LLM_JUDGE: '1'
      # CI 默认不把测试数据发往外部 observability backend。
      TELEMETRY_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm eval:ci
